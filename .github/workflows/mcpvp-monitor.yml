name: MCPVP Status Monitor

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: mcpvp-status-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check MCPVP status
        env:
          MONITOR_URL: https://mcpvp.wtf
          CRON_SECRET: ${{ secrets.MCPVP_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing MCPVP_CRON_SECRET repository secret."
            exit 1
          fi
          curl --fail --silent --show-error --retry 2 --max-time 45 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$MONITOR_URL/api/monitor"
          echo
